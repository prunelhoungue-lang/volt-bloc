name: Construire FoodConnect (APK)
on:
  workflow_dispatch:
  push:
    paths:
      - 'foodconnect/**'
      - '.github/workflows/build-foodconnect.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foodconnect-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Préparer le projet
        working-directory: .
        run: |
          mkdir -p foodconnect-app/www
          cp foodconnect/index.html foodconnect/app.js foodconnect/leaflet.js foodconnect/leaflet.css foodconnect-app/www/
          cat > foodconnect-app/package.json <<'EOF'
          {
            "name": "foodconnect",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^8.6.2",
              "@capacitor/cli": "^8.6.2",
              "@capacitor/core": "^8.6.2"
            }
          }
          EOF
          cat > foodconnect-app/capacitor.config.json <<'EOF'
          {
            "appId": "com.allcreation.foodconnect",
            "appName": "FoodConnect",
            "webDir": "www",
            "backgroundColor": "#14100d"
          }
          EOF
      - run: npm install
      - run: npx cap add android
      - name: Autoriser la localisation GPS
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: foodconnect-apk
          path: foodconnect-app/android/app/build/outputs/apk/debug/app-debug.apk
