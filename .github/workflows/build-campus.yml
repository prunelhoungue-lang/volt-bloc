name: Construire Campus Services (APK)
on:
  workflow_dispatch:
  push:
    paths:
      - 'campus/**'
      - '.github/workflows/build-campus.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campus-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Préparer le projet
        working-directory: .
        run: |
          mkdir -p campus-app/www
          cp campus/index.html campus-app/www/index.html
          cat > campus-app/package.json <<'EOF'
          {
            "name": "campus-services",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^8.6.2",
              "@capacitor/cli": "^8.6.2",
              "@capacitor/core": "^8.6.2"
            }
          }
          EOF
          cat > campus-app/capacitor.config.json <<'EOF'
          {
            "appId": "com.allcreation.campusservices",
            "appName": "Campus Services",
            "webDir": "www",
            "backgroundColor": "#1546d1"
          }
          EOF
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: campus-services-apk
          path: campus-app/android/app/build/outputs/apk/debug/app-debug.apk
