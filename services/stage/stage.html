<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0f172a;font-family:"Inter Display",Inter,"Noto Color Emoji",sans-serif;color:#fff}
body::before{content:"";position:absolute;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,#ff6a2b44,#ff6a2b00 70%);right:-500px;top:-450px}
body::after{content:"";position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,#1faa5930,#1faa5900 70%);left:-420px;bottom:-380px}
.brand{position:absolute;top:70px;left:0;right:0;text-align:center;font-weight:800;letter-spacing:4px;font-size:34px;color:#ff6a2b;z-index:3}
#cap{position:absolute;top:150px;left:60px;right:60px;text-align:center;font-weight:800;font-size:68px;line-height:1.1;letter-spacing:-1px;z-index:3;transition:opacity .25s,transform .25s}
#cap.h{opacity:0;transform:translateY(-14px)}
#cap em{font-style:normal;color:#ff6a2b}#cap g{color:#1faa59}
.phone{position:absolute;left:150px;top:360px;width:780px;height:1440px;border-radius:70px;border:16px solid #1e293b;background:#000;overflow:hidden;box-shadow:0 50px 100px #000a;z-index:2}
#f{width:374px;height:688px;border:0;transform:scale(2);transform-origin:0 0;background:#fff}
#tap{position:absolute;width:110px;height:110px;border-radius:50%;background:#ffffff55;border:4px solid #fff;z-index:5;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.6);transition:opacity .15s,transform .15s}
#tap.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#wa{position:absolute;inset:0;pointer-events:none;background:#0b141a;z-index:4;display:flex;flex-direction:column;opacity:0;transition:opacity .35s}
#wa.on{opacity:1}
#wa .hd{background:#1f2c34;padding:40px 34px 30px;display:flex;align-items:center;gap:22px;font-size:34px;font-weight:700;color:#e9edef}
#wa .hd i{width:76px;height:76px;border-radius:50%;background:#b3261e;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:40px}
#wa .hd small{display:block;font-size:24px;font-weight:500;color:#8696a0}
#wa .bd{flex:1;padding:40px 30px;display:flex;flex-direction:column;justify-content:flex-start}
#wa .m{background:#202c33;color:#e9edef;border-radius:8px 30px 30px 30px;padding:30px 32px;font-size:31px;line-height:1.45;white-space:pre-wrap;max-width:94%;transform:translateY(30px) scale(.96);opacity:0;transition:all .4s}
#wa.on .m{transform:none;opacity:1}
#wa .m .t{display:block;text-align:right;font-size:22px;color:#8696a0;margin-top:8px}
#end{position:absolute;inset:0;pointer-events:none;background:#0f172a;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;opacity:0;transition:opacity .4s;text-align:center;padding:80px}
#end.on{opacity:1}
#end .b{font-size:64px;font-weight:800;letter-spacing:6px;color:#ff6a2b}
#end h2{font-size:84px;line-height:1.08;letter-spacing:-1px}
#end .c{background:#1faa59;border-radius:32px;padding:34px 44px;font-size:44px;font-weight:800}
#end p{font-size:38px;opacity:.8}
</style></head><body>
<div class="brand">PRINEL</div>
<div id="cap"></div>
<div class="phone" id="ph"><iframe id="f" src="../demo-resto/"></iframe>
 <div id="wa"><div class="hd"><i>🍲</i><div>Client · Awa<small>en ligne</small></div></div><div class="bd"><div class="m" id="m"></div></div></div>
</div>
<div id="tap"></div>
<div id="end"><div class="b">PRINEL</div><h2>Je crée la même<br>pour <g style="color:#1faa59">ton commerce</g> 📲</h2><div class="c">💬 Écris « DÉMO »</div><p>WhatsApp +229 01 62 24 99 23</p></div>
<script>
const cap=document.getElementById('cap');
window.setCap=h=>{cap.classList.add('h');setTimeout(()=>{cap.innerHTML=h;cap.classList.remove('h')},250)};
window.tap=(x,y)=>{const t=document.getElementById('tap');t.style.left=x+'px';t.style.top=y+'px';t.classList.add('on');setTimeout(()=>t.classList.remove('on'),280)};
window.showWA=txt=>{document.getElementById('m').innerHTML=txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*([^*]+)\*/g,'<b>$1</b>').replace(/🧪 <b>DÉMO<\/b> — /,'')+'<span class="t">19:42 ✓✓</span>';document.getElementById('wa').classList.add('on')};
window.end=()=>document.getElementById('end').classList.add('on');
const f=document.getElementById('f');
f.addEventListener('load',()=>{const w=f.contentWindow;w.open=u=>{const t=decodeURIComponent(u.split('text=')[1]||'');window.showWA(t)};
 const st=w.document.createElement('style');st.textContent='.demo{display:none}';w.document.head.appendChild(st)});
</script></body></html>
