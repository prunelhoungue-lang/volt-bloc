<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>PRINEL HBTP — jeu de tir en ligne</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:#fff;overscroll-behavior:none}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:calc(6px + env(safe-area-inset-top));right:8px;display:flex;flex-direction:column;gap:3px;font-size:12px;pointer-events:none;z-index:5;align-items:flex-end}
.pl{background:#000a;border-left:4px solid #fff;border-radius:6px;padding:3px 8px;white-space:nowrap}
.pl.me{outline:1px solid #ffd23a}
#time{position:fixed;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-weight:800;font-size:18px;text-shadow:0 0 8px #000;z-index:5;pointer-events:none}
#msg{position:fixed;left:50%;top:26%;transform:translateX(-50%);font-size:24px;font-weight:900;text-shadow:0 0 10px #000;pointer-events:none;opacity:0;z-index:10;white-space:nowrap}
#msg.show{animation:msg 1.4s ease-out}
@keyframes msg{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
#ov{position:fixed;inset:0;background:#0a1020c8;display:flex;align-items:center;justify-content:center;z-index:20}
.card{background:#0b1430;border:2px solid #ffd23a;box-shadow:0 0 30px #ffd23a55;border-radius:20px;padding:20px 18px;text-align:center;width:min(90vw,380px);max-height:94vh;overflow:auto}
.card h1,.card h2{margin:0 0 6px;color:#ffd23a;letter-spacing:1px}
.card h1{font-size:34px}
.card p{margin:6px 0 10px;opacity:.9;line-height:1.35;font-size:14px}
.card input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid #2a3a66;background:#050a1f;color:#fff;text-align:center;margin:4px 0}
.b{font:inherit;font-weight:800;border:0;border-radius:14px;padding:13px;width:100%;margin-top:9px;color:#1a1000;background:#ffd23a}
.b.alt{background:#4fd36a}.b.gh{background:#16224d;color:#dff6ff}.b:disabled{opacity:.4}
.code{font-size:42px;font-weight:900;letter-spacing:6px;color:#4fd36a;margin:4px 0}
.row2{display:flex;gap:8px}.row2 input{flex:1}.row2 .b{width:auto;margin-top:4px;padding:12px 16px}
.li{padding:6px 8px;border-bottom:1px solid #223;text-align:left;border-left:6px solid #fff;margin:3px 0}
.small{font-size:12px;opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="time"></div>
<div id="msg"></div>
<div id="ov"><div class="card" id="card"></div></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const W=2000,H=1000,PW=22,PH=40,GOAL=15,GAME_T=300,MAXP=6;
const COLS=['#3aa0ff','#ff5a4a','#4fd36a','#ffd23a','#c06bff','#ff9a3a'];
const BOTN=['Koffi','Ayaba','Dossou','Sènami','Kokou','Afi'];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cv=$('#c'),ctx=cv.getContext('2d');
let vw=0,vh=0;
function resize(){const d=Math.min(2,window.devicePixelRatio||1);vw=innerWidth;vh=innerHeight;cv.width=vw*d;cv.height=vh*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();

/* ============ CARTE ============ */
const PL=[[100,780,260],[430,700,220],[760,820,240],[1040,640,260],[1360,780,240],[1620,700,260],[300,540,260],[700,480,220],[1000,380,300],[1380,520,240],[1660,420,220],[160,340,200],[880,230,240],[1500,260,200]];
const SOL=[[0,940,W,60],[-40,-300,40,1500],[W,-300,40,1500],[0,-40,W,40]].concat(PL.map(function(p){return[p[0],p[1],p[2],24]}));
const SPAWN=PL.map(function(p){return[p[0]+p[2]/2-PW/2,p[1]-PH-2]}).concat([[300,898],[1000,898],[1700,898]]);
function solidAt(x,y){for(let i=0;i<SOL.length;i++){const r=SOL[i];if(x>r[0]&&x<r[0]+r[2]&&y>r[1]&&y<r[1]+r[3])return true}return false}
const WP=[{n:'Pistolet',dmg:12,rate:.28,sp:.03,pel:1,v:900,life:.7,len:14},{n:'Fusil',dmg:9,rate:.09,sp:.07,pel:1,v:1000,life:.8,len:22},{n:'Fusil à pompe',dmg:8,rate:.75,sp:.2,pel:6,v:800,life:.35,len:20},{n:'Sniper',dmg:70,rate:1.1,sp:0,pel:1,v:1800,life:1,len:30}];
const PKTY={h:{c:'#ff5a5a',l:'+'},r:{c:'#ffd23a',l:'F'},s:{c:'#ff9a3a',l:'P'},n:{c:'#c06bff',l:'S'}};

/* ============ PHYSIQUE ============ */
function colAxis(b,horiz){
  for(let i=0;i<SOL.length;i++){const r=SOL[i];
    if(b.x<r[0]+r[2]&&b.x+PW>r[0]&&b.y<r[1]+r[3]&&b.y+PH>r[1]){
      if(horiz){if(b.vx>0)b.x=r[0]-PW;else if(b.vx<0)b.x=r[0]+r[2];b.vx=0}
      else{if(b.vy>0){b.y=r[1]-PH;b.on=true}else if(b.vy<0){b.y=r[1]+r[3]}b.vy=0}}}
}
function stepBody(b,dt,mx,jet){
  b.vx+=(mx*210-b.vx)*Math.min(1,(b.on?16:5)*dt);
  b.vy+=900*dt;
  b.jt=false;
  if(jet&&b.fuel>0){b.vy-=1650*dt;b.fuel=Math.max(0,b.fuel-dt*.45);b.jt=true}else b.fuel=Math.min(1,b.fuel+dt*(b.on?.5:.2));
  b.vy=clamp(b.vy,-330,700);
  b.x+=b.vx*dt;colAxis(b,true);
  b.y+=b.vy*dt;b.on=false;colAxis(b,false);
}

/* ============ SIMULATION (hôte) ============ */
const sim={phase:'menu',players:{},bullets:[],pk:[],tl:GAME_T,bid:1,pid:1,pkT:4,events:[]};
function pickSpawn(){
  const alive=Object.values(sim.players).filter(function(p){return p.dead<=0});
  const good=SPAWN.filter(function(s){return alive.every(function(p){return Math.hypot(p.x-s[0],p.y-s[1])>300})});
  const L=good.length?good:SPAWN;return L[Math.floor(Math.random()*L.length)];
}
function addPlayer(id,name,bot){
  const used=Object.values(sim.players).map(function(p){return p.col});let col=0;while(used.indexOf(col)>=0)col++;
  const s=pickSpawn();
  sim.players[id]={id:id,name:name,col:col,x:s[0],y:s[1],vx:0,vy:0,a:0,f:1,w:0,am:-1,hp:100,k:0,d:0,dead:0,fuel:1,on:false,j:false,jt:false,cd:0,ign:0,bot:!!bot,mx:0,jet:false,fireT:1,aimErr:0};
}
function startMatch(){
  sim.phase='play';sim.tl=GAME_T;sim.bullets=[];sim.pk=[];sim.pkT=3;sim.events=[];
  Object.values(sim.players).forEach(function(p){const s=pickSpawn();p.x=s[0];p.y=s[1];p.vx=p.vy=0;p.hp=100;p.k=0;p.d=0;p.dead=0;p.w=0;p.am=-1;p.fuel=1;p.cd=1;p.ign=.6;sim.events.push({e:'r',id:p.id,x:p.x,y:p.y})});
}
function respawn(p){const s=pickSpawn();p.x=s[0];p.y=s[1];p.vx=p.vy=0;p.hp=100;p.w=0;p.am=-1;p.fuel=1;p.ign=.6;sim.events.push({e:'r',id:p.id,x:p.x,y:p.y})}
function hostFire(id,a){
  const p=sim.players[id];if(!p||sim.phase!=='play'||p.dead>0||p.cd>0)return;
  const wp=WP[p.w];p.cd=wp.rate*.8;
  if(p.w!==0){p.am--;if(p.am<=0){p.w=0;p.am=-1}}
  const bs=[];
  for(let i=0;i<wp.pel;i++){const ang=a+(Math.random()-.5)*2*wp.sp;const b={i:sim.bid++,o:id,x:p.x+PW/2,y:p.y+16,vx:Math.cos(ang)*wp.v,vy:Math.sin(ang)*wp.v,dmg:wp.dmg,life:wp.life};sim.bullets.push(b);bs.push({i:b.i,o:id,x:Math.round(b.x),y:Math.round(b.y),vx:Math.round(b.vx),vy:Math.round(b.vy),l:wp.life,w:p.w===0&&false?0:p.w})}
  sim.events.push({e:'b',bs:bs,w:bs.length?wpIdx(wp):0});
}
function wpIdx(wp){return WP.indexOf(wp)}
function botAI(b,dt){
  const others=Object.values(sim.players).filter(function(q){return q.id!==b.id&&q.dead<=0});
  let t=null,bd=1e9;others.forEach(function(q){const d=Math.hypot(q.x-b.x,q.y-b.y);if(d<bd){bd=d;t=q}});
  if(!t){b.mx=0;b.jet=false;return}
  const dx=t.x-b.x,dy=t.y-b.y;
  b.mx=Math.abs(dx)>260?Math.sign(dx):(Math.abs(dx)<110?-Math.sign(dx):Math.sin(performance.now()/1300+b.col)*.6);
  b.jet=dy<-50||(b.y>820&&!b.on&&b.vy>150);
  b.a=Math.atan2(dy,dx)+(Math.random()-.5)*.3;b.f=Math.cos(b.a)>=0?1:-1;
  b.fireT-=dt;if(bd<700&&b.fireT<=0&&Math.abs(dy)<350){hostFire(b.id,b.a);b.fireT=.3+Math.random()*.7}
}
function hit(b,q){
  q.hp-=b.dmg;sim.events.push({e:'h',v:q.id,by:b.o,i:b.i,hp:Math.max(0,Math.round(q.hp)),dm:b.dmg,x:Math.round(b.x),y:Math.round(b.y)});
  if(q.hp<=0){q.hp=0;q.dead=3;q.d++;q.j=false;const k=sim.players[b.o];if(k&&k!==q)k.k++;sim.events.push({e:'k',by:b.o,v:q.id})}
}
function simStep(dt){
  if(sim.phase!=='play')return;
  sim.tl-=dt;
  const ps=Object.values(sim.players);
  if(sim.tl<=0||ps.some(function(p){return p.k>=GOAL})){sim.phase='end';return}
  ps.forEach(function(p){
    p.cd=Math.max(0,p.cd-dt);if(p.ign>0)p.ign-=dt;
    if(p.dead>0){p.dead-=dt;if(p.dead<=0){p.dead=0;respawn(p)}}
    else if(p.bot){botAI(p,dt);stepBody(p,dt,p.mx,p.jet);p.j=p.jt}
  });
  const alive=ps.filter(function(p){return p.dead<=0});
  for(let i=sim.bullets.length-1;i>=0;i--){
    const b=sim.bullets[i],sp=Math.hypot(b.vx,b.vy),n=Math.max(1,Math.ceil(sp*dt/8));let gone=false;
    for(let s=0;s<n&&!gone;s++){
      b.x+=b.vx*dt/n;b.y+=b.vy*dt/n;
      if(solidAt(b.x,b.y)){gone=true;break}
      for(let k=0;k<alive.length;k++){const q=alive[k];if(q.id===b.o||q.dead>0)continue;
        if(b.x>q.x-2&&b.x<q.x+PW+2&&b.y>q.y-2&&b.y<q.y+PH+2){hit(b,q);gone=true;break}}
    }
    b.life-=dt;if(gone||b.life<=0)sim.bullets.splice(i,1);
  }
  alive.forEach(function(p){
    if(p.dead>0)return;
    for(let i=sim.pk.length-1;i>=0;i--){const k=sim.pk[i];
      if(Math.hypot(p.x+PW/2-k.x,p.y+PH/2-k.y)<28){
        if(k.ty==='h'){if(p.hp>=100)continue;p.hp=Math.min(100,p.hp+50)}
        else if(k.ty==='r'){p.w=1;p.am=40}else if(k.ty==='s'){p.w=2;p.am=8}else{p.w=3;p.am=5}
        sim.events.push({e:'pk',id:p.id,ty:k.ty});sim.pk.splice(i,1)}}
  });
  sim.pkT-=dt;
  if(sim.pkT<=0){sim.pkT=6+Math.random()*4;if(sim.pk.length<5){const s=SPAWN[Math.floor(Math.random()*SPAWN.length)];const r=Math.random();
    sim.pk.push({i:sim.pid++,x:Math.round(s[0]+PW/2),y:Math.round(s[1]+PH-12),ty:r<.3?'h':r<.55?'r':r<.8?'s':'n'})}}
}
function makeState(){
  return{t:'s',ph:sim.phase,tl:Math.max(0,Math.round(sim.tl)),
    ps:Object.values(sim.players).map(function(p){return{id:p.id,n:p.name,c:p.col,x:Math.round(p.x),y:Math.round(p.y),vx:Math.round(p.vx),vy:Math.round(p.vy),a:+p.a.toFixed(2),f:p.f,w:p.w,am:p.am,hp:Math.round(p.hp),k:p.k,d:p.d,dd:p.dead>0?Math.ceil(p.dead):0,j:p.j?1:0}}),
    pk:sim.pk,ev:sim.events};
}

/* ============ CLIENT ============ */
let myId='h',myName='Joueur',net={mode:'off'},lastPh='',lobbySig='',gid=0,loopId=0,accT=0,lastT=0,bcT=0;
let view={ph:'menu',ps:[],pk:[],tl:0},ents={};
const me={x:900,y:880,vx:0,vy:0,fuel:1,on:false,jt:false,hp:100,w:0,am:-1,dead:0,a:0,f:1,cd:0};
let bl=[],sparks=[],floats=[],cam={x:1000,y:500},meScr={x:0,y:0},shots=0;
const ctl={mx:0,jet:false,fire:false,aim:0,aimed:false};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nameOf(id){const p=view.ps.find(function(p){return p.id===id});return p?p.n:'?'}
function say(t,col){const m=$('#msg');m.textContent=t;m.style.color=col||'#fff';m.classList.remove('show');void m.offsetWidth;m.classList.add('show')}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
let AC=null;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}return AC}
function gun(w,vol,pan){
  const a=ac();if(!a)return;
  try{const len=w===3?.5:w===2?.3:.15,n=(a.sampleRate*len)|0,buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,w===3?2:3);
  const s=a.createBufferSource();s.buffer=buf;const g=a.createGain();g.gain.value=vol;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=w===3?900:w===2?1200:2200;s.connect(f);f.connect(g);let out=g;
  if(a.createStereoPanner){const p=a.createStereoPanner();p.pan.value=clamp(pan,-1,1);g.connect(p);out=p}out.connect(a.destination);s.start()}catch(e){}
}
function beep(f,d,v){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(v||.1,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}

function applyState(st){
  view.ph=st.ph;view.tl=st.tl;view.pk=st.pk||[];
  view.ps=st.ps;
  st.ps.forEach(function(p){
    let e=ents[p.id];if(!e)e=ents[p.id]={x:p.x,y:p.y};
    e.tx=p.x;e.ty=p.y;e.vx=p.vx;e.vy=p.vy;e.a=p.a;e.f=p.f;e.w=p.w;e.hp=p.hp;e.c=p.c;e.n=p.n;e.dd=p.dd;e.j=p.j;e.k=p.k;
    if(p.id===myId){me.hp=p.hp;me.w=p.w;me.am=p.am;me.dead=p.dd;me.k=p.k;me.d=p.d}
  });
  Object.keys(ents).forEach(function(id){if(!st.ps.some(function(p){return p.id===id}))delete ents[id]});
  (st.ev||[]).forEach(handleEvent);
  updateHud();
  if(st.ph!==lastPh){lastPh=st.ph;onPhase(st.ph)}else if(st.ph==='lobby')renderLobby();
}
function handleEvent(e){
  if(e.e==='b'){
    e.bs.forEach(function(b){bl.push({i:b.i,o:b.o,x:b.x,y:b.y,vx:b.vx,vy:b.vy,l:b.l})});
    const o=ents[e.bs[0]&&e.bs[0].o];
    if(o||e.bs.length){const ox=e.bs[0].x;const w=e.w||0;
      if(e.bs[0].o!==myId)gun(w,clamp(.45-Math.abs(ox-me.x)/2500,.08,.4),(ox-me.x)/700);
      for(let k=0;k<3;k++)sparks.push({x:e.bs[0].x,y:e.bs[0].y,vx:(Math.random()-.5)*80+e.bs[0].vx*.05,vy:(Math.random()-.5)*80,l:.25,c:'#ffe28a'})}
  }else if(e.e==='h'){
    bl=bl.filter(function(b){return b.i!==e.i});
    for(let k=0;k<5;k++)sparks.push({x:e.x,y:e.y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,l:.4,c:'#ff6a5a'});
    floats.push({x:e.x,y:e.y-10,t:.7,s:'-'+e.dm,c:'#fff'});
    if(e.v===myId){vib(60);beep(180,.12,.12);me.hp=e.hp}
    if(e.by===myId)beep(900,.05,.08);
  }else if(e.e==='k'){
    if(e.by===myId){say('Tu as éliminé '+nameOf(e.v)+' 🎯','#7dff9a');vib([40,30,40])}
    else if(e.v===myId){say('Éliminé par '+nameOf(e.by),'#ff6a5a');vib(250)}
    else say(nameOf(e.by)+' ➜ '+nameOf(e.v),'#ffe28a');
  }else if(e.e==='r'){
    if(e.id===myId){me.x=e.x;me.y=e.y;me.vx=me.vy=0;me.fuel=1;me.dead=0;me.hp=100}
    else{const t=ents[e.id];if(t){t.x=e.x;t.y=e.y}}
  }else if(e.e==='pk'){
    if(e.id===myId){beep(660,.1,.1);say(e.ty==='h'?'+50 vie':e.ty==='r'?'Fusil !':e.ty==='s'?'Fusil à pompe !':'Sniper !','#9cf')}
  }
}
function updateHud(){
  const ps=view.ps.slice().sort(function(a,b){return b.k-a.k});
  $('#hud').innerHTML=(view.ph==='play'||view.ph==='end')?ps.map(function(p){return '<div class="pl'+(p.id===myId?' me':'')+'" style="border-left-color:'+COLS[p.c%6]+'">'+esc(p.n)+' <b>'+p.k+'</b></div>'}).join(''):'';
  $('#time').textContent=view.ph==='play'?Math.floor(view.tl/60)+':'+String(view.tl%60).padStart(2,'0'):'';
}
function onPhase(ph){
  if(ph==='play'){$('#ov').style.display='none';bl=[];sparks=[];floats=[];me.cd=1;me.dead=0;const m=sim.players&&sim.players[myId];if(m){me.x=m.x;me.y=m.y}}
  else if(ph==='lobby'){lobbySig='';renderLobby()}
  else if(ph==='end')showEnd();
}

/* ============ UI ============ */
function card(html){const o=$('#ov');o.style.display='flex';const c=$('#card');c.innerHTML=html;return c}
function btn(c,t,fn,cls){const b=document.createElement('button');b.className='b '+(cls||'');b.textContent=t;b.onclick=fn;c.appendChild(b);return b}
function getName(){let n='Joueur';try{n=localStorage.getItem('hbtp_name')||n}catch(e){}return n}
function saveName(v){myName=(String(v||'').trim().slice(0,12))||'Joueur';try{localStorage.setItem('hbtp_name',myName)}catch(e){}}
function showMenu(){
  const c=card('<h1>PRINEL HBTP</h1><p>Jeu de tir en ligne, 2 à 6 joueurs.<br>Jetpack, armes à ramasser, premier à 15 éliminations !</p>');
  const inp=document.createElement('input');inp.placeholder='Ton nom';inp.maxLength=12;inp.value=getName();c.appendChild(inp);
  btn(c,'🌐 Créer une partie',function(){saveName(inp.value);ac();startHost()},'alt');
  const row=document.createElement('div');row.className='row2';const ci=document.createElement('input');ci.placeholder='CODE';ci.maxLength=4;ci.style.textTransform='uppercase';row.appendChild(ci);
  const jb=document.createElement('button');jb.className='b gh';jb.textContent='Rejoindre';jb.onclick=function(){saveName(inp.value);ac();startGuest(ci.value)};row.appendChild(jb);c.appendChild(row);
  const h=document.createElement('p');h.className='small';h.textContent='Connexion Internet requise · Mets ton téléphone en mode paysage · Joystick gauche : bouger / jetpack · Joystick droit : viser et tirer';c.appendChild(h);
  const f=document.createElement('p');f.className='small';f.textContent='Fait au Bénin 🇧🇯';c.appendChild(f);
}
function err(msg){const c=card('<h2>Oups</h2>');const p=document.createElement('p');p.textContent=msg;c.appendChild(p);btn(c,'Menu',function(){location.reload()})}
function renderLobby(){
  const sig=view.ps.map(function(p){return p.id+p.n}).join('|');if(sig===lobbySig)return;lobbySig=sig;
  const c=card('<h2>SALON</h2>');
  if(net.mode==='host'){const p=document.createElement('p');p.textContent='Donne ce code à tes amis :';c.appendChild(p);const d=document.createElement('div');d.className='code';d.textContent=net.code;c.appendChild(d)}
  view.ps.forEach(function(p){const d=document.createElement('div');d.className='li';d.style.borderLeftColor=COLS[p.c%6];d.textContent=p.n+(p.id===myId?' (toi)':'');c.appendChild(d)});
  if(net.mode==='host'){
    const n=view.ps.length;
    if(n<MAXP)btn(c,'➕ Ajouter un bot',function(){const k=Object.values(sim.players).filter(function(p){return p.bot}).length;addPlayer('b'+(++gid),'Bot '+BOTN[k%BOTN.length],true);broadcast()},'gh');
    const b=btn(c,n<2?'En attente de joueurs…':'▶ Démarrer',function(){startMatch();broadcast()});b.disabled=n<2;
  }else{const p=document.createElement('p');p.textContent="En attente de l'hôte…";c.appendChild(p)}
  btn(c,'Quitter',function(){location.reload()},'gh');
}
function showEnd(){
  const ps=view.ps.slice().sort(function(a,b){return b.k-a.k});
  const c=card('<h2>FIN DE LA PARTIE</h2>');
  ps.forEach(function(p,i){const d=document.createElement('div');d.className='li';d.style.borderLeftColor=COLS[p.c%6];d.textContent=(i===0?'🏆 ':(i+1)+'. ')+p.n+' — '+p.k+' éliminations · '+p.d+' morts';c.appendChild(d)});
  if(net.mode==='host')btn(c,'Rejouer',function(){startMatch();broadcast()});
  else{const p=document.createElement('p');p.className='small';p.textContent="L'hôte peut relancer une partie.";c.appendChild(p)}
  btn(c,'Menu',function(){location.reload()},'gh');
}

/* ============ RÉSEAU ============ */
const PEERCFG={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'}]}};
function broadcast(){
  if(net.mode==='guest')return;
  const st=makeState();
  if(net.mode==='host')(net.conns||[]).forEach(function(c){if(c.open&&c._id)try{c.send(st)}catch(e){}});
  applyState(st);sim.events=[];
}
function hostTick(){
  const now=performance.now()/1000,dt=Math.min(.1,now-(lastT||now));lastT=now;
  accT+=dt;while(accT>=1/60){simStep(1/60);accT-=1/60}
  bcT+=dt;if(bcT>=.05){bcT=0;broadcast()}
}
function startLoop(){clearInterval(loopId);lastT=0;accT=0;bcT=0;loopId=setInterval(hostTick,16)}
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function startHost(){
  if(typeof Peer==='undefined')return err('Réseau indisponible. Connecte-toi à Internet puis réessaie.');
  net={mode:'host',conns:[]};myId='h';sim.players={};sim.phase='lobby';addPlayer('h',myName);lastPh='';
  let tries=0;
  (function open(){
    const code=genCode(),peer=new Peer('hbtp-'+code,PEERCFG);net.peer=peer;net.code=code;
    peer.on('open',function(){startLoop();broadcast()});
    peer.on('error',function(e){if(e.type==='unavailable-id'&&tries++<5){try{peer.destroy()}catch(x){}open()}else err('Erreur réseau : '+e.type)});
    peer.on('connection',function(c){
      c.on('open',function(){
        if(sim.phase!=='lobby'||Object.keys(sim.players).length>=MAXP){try{c.send({t:'full'})}catch(e){}setTimeout(function(){c.close()},400);return}
        c._id='g'+(++gid);net.conns.push(c)});
      c.on('data',function(m){
        if(!m||!c._id)return;
        const p=sim.players[c._id];
        if(m.t==='join'&&!p){addPlayer(c._id,String(m.n||'Joueur').slice(0,12));c.send({t:'welcome',id:c._id});broadcast()}
        else if(m.t==='p'&&p&&p.dead<=0&&!(p.ign>0)){p.x=clamp(+m.x||0,0,W);p.y=clamp(+m.y||0,-40,H);p.vx=+m.vx||0;p.vy=+m.vy||0;p.a=+m.a||0;p.f=m.f<0?-1:1;p.j=!!m.j}
        else if(m.t==='f'&&p)hostFire(c._id,+m.a||0)});
      c.on('close',function(){if(c._id){delete sim.players[c._id];net.conns=net.conns.filter(function(x){return x!==c});broadcast()}});
    });
  })();
}
function startGuest(code){
  if(typeof Peer==='undefined')return err('Réseau indisponible. Connecte-toi à Internet puis réessaie.');
  code=String(code||'').toUpperCase().trim();if(code.length<4)return err('Entre le code à 4 caractères donné par ton ami.');
  net={mode:'guest'};lastPh='';
  const peer=new Peer(PEERCFG);net.peer=peer;
  const to=setTimeout(function(){err('Impossible de se connecter. Vérifie le code et ta connexion Internet.')},15000);
  peer.on('open',function(){
    const c=peer.connect('hbtp-'+code,{reliable:true});net.conn=c;
    c.on('open',function(){c.send({t:'join',n:myName})});
    c.on('data',function(m){
      if(!m)return;
      if(m.t==='welcome'){clearTimeout(to);myId=m.id}
      else if(m.t==='full'){clearTimeout(to);err('La partie est pleine ou déjà commencée.')}
      else if(m.t==='s')applyState(m)});
    c.on('close',function(){err("Connexion perdue avec l'hôte.")});
  });
  peer.on('error',function(e){clearTimeout(to);err(e.type==='peer-unavailable'?'Code introuvable. Vérifie-le.':'Erreur réseau : '+e.type)});
}

/* ============ COMMANDES ============ */
const st={L:null,R:null};let keyMx=0,keyJet=false,mouseDown=false;
function updateCtl(){
  const RR=70;
  if(st.L){const dx=(st.L.x-st.L.ox)/RR,dy=(st.L.y-st.L.oy)/RR,m=Math.hypot(dx,dy),k=m>1?1/m:1;ctl.mx=Math.abs(dx*k)>.18?dx*k:0;ctl.jet=dy*k<-.45}
  else{ctl.mx=keyMx;ctl.jet=keyJet}
  if(st.R){const dx=(st.R.x-st.R.ox)/RR,dy=(st.R.y-st.R.oy)/RR,m=Math.hypot(dx,dy);if(m>.28){ctl.aim=Math.atan2(dy,dx);ctl.aimed=true;ctl.fire=true}else ctl.fire=false}
  else if(!mouseDown)ctl.fire=false;
}
cv.addEventListener('pointerdown',function(e){
  if(view.ph!=='play')return;
  if(e.pointerType==='mouse'){mouseDown=true;ctl.fire=true;ctl.aim=Math.atan2(e.clientY-meScr.y,e.clientX-meScr.x);ctl.aimed=true;return}
  const o={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};
  if(e.clientX<vw/2){if(!st.L)st.L=o}else{if(!st.R)st.R=o}
  try{cv.setPointerCapture(e.pointerId)}catch(x){}updateCtl();
});
cv.addEventListener('pointermove',function(e){
  if(e.pointerType==='mouse'){if(view.ph==='play'){ctl.aim=Math.atan2(e.clientY-meScr.y,e.clientX-meScr.x);ctl.aimed=true}return}
  if(st.L&&st.L.id===e.pointerId){st.L.x=e.clientX;st.L.y=e.clientY}
  if(st.R&&st.R.id===e.pointerId){st.R.x=e.clientX;st.R.y=e.clientY}
  updateCtl();
});
function up(e){
  if(e.pointerType==='mouse'){mouseDown=false;ctl.fire=false;return}
  if(st.L&&st.L.id===e.pointerId)st.L=null;if(st.R&&st.R.id===e.pointerId)st.R=null;updateCtl();
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',function(e){const k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')keyMx=-1;else if(k==='d'||k==='arrowright')keyMx=1;else if(k==='w'||k==='arrowup'||k===' ')keyJet=true;updateCtl()});
addEventListener('keyup',function(e){const k=e.key.toLowerCase();if((k==='a'||k==='arrowleft')&&keyMx<0)keyMx=0;else if((k==='d'||k==='arrowright')&&keyMx>0)keyMx=0;else if(k==='w'||k==='arrowup'||k===' ')keyJet=false;updateCtl()});

/* ============ MONDE (rendu) ============ */
let bg=null;
function buildBg(){
  bg=document.createElement('canvas');bg.width=W;bg.height=H;const g=bg.getContext('2d'),R=mulberry(42);
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2f8fe8');gr.addColorStop(.6,'#9fd4ff');gr.addColorStop(1,'#e8f6ff');g.fillStyle=gr;g.fillRect(0,0,W,H);
  const sg=g.createRadialGradient(1500,140,8,1500,140,170);sg.addColorStop(0,'rgba(255,255,230,1)');sg.addColorStop(.3,'rgba(255,244,170,.5)');sg.addColorStop(1,'rgba(255,240,150,0)');g.fillStyle=sg;g.fillRect(1300,0,400,360);
  g.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<12;i++){const cx=R()*W,cy=40+R()*320,s=.8+R();for(let k=0;k<4;k++){g.beginPath();g.ellipse(cx+k*24*s,cy+(k%2)*5,28*s,12*s,0,0,7);g.fill()}}
  [['#7bb872',760,.006,60],['#5a9a55',850,.01,40]].forEach(function(a,k){g.fillStyle=a[0];g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=20)g.lineTo(x,a[1]-Math.sin(x*a[2]+k*2)*a[3]-Math.sin(x*a[2]*2.3+k)*a[3]*.5);g.lineTo(W,H);g.fill()});
  for(let i=0;i<12;i++){const x=R()*W;g.fillStyle='#4a3320';g.fillRect(x-4,880,8,60);g.fillStyle='#2f6a2c';g.beginPath();g.ellipse(x,872,36,18,0,0,7);g.fill()}
  SOL.forEach(function(r){if(r[0]<0||r[1]<0)return;
    const gd=g.createLinearGradient(0,r[1],0,r[1]+r[3]);gd.addColorStop(0,'#a8683a');gd.addColorStop(1,'#6e3f1f');g.fillStyle=gd;g.fillRect(r[0],r[1],r[2],r[3]);
    g.fillStyle='#58b04a';g.fillRect(r[0],r[1],r[2],7);g.fillStyle='#3f8a35';g.fillRect(r[0],r[1]+7,r[2],3);
    g.fillStyle='rgba(60,30,10,.35)';for(let k=0;k<r[2]/14;k++){g.fillRect(r[0]+R()*r[2],r[1]+12+R()*(Math.max(4,r[3]-16)),3,2)}});
}
function drawPlayer(e,now,isMe){
  const dead=isMe?me.dead>0:e.dd>0;if(dead)return;
  const x=e.x+PW/2,y=e.y,col=COLS[(e.c||0)%6],jet=isMe?me.jt:!!e.j,vx=isMe?me.vx:e.vx,on=isMe?me.on:true;
  const f=e.f||1,a=e.a||0,w=isMe?me.w:e.w;
  if(jet){ctx.fillStyle='#ffb02e';ctx.beginPath();ctx.moveTo(x-5,y+30);ctx.lineTo(x,y+30+14+Math.random()*10);ctx.lineTo(x+5,y+30);ctx.fill();ctx.fillStyle='#fff3a0';ctx.beginPath();ctx.moveTo(x-2,y+30);ctx.lineTo(x,y+36+Math.random()*5);ctx.lineTo(x+2,y+30);ctx.fill()}
  ctx.fillStyle='#333';const sw=(on&&Math.abs(vx)>20)?Math.sin(now*14)*5:0;ctx.fillRect(x-6+sw,y+30,5,10);ctx.fillRect(x+1-sw,y+30,5,10);
  ctx.fillStyle='#555';ctx.fillRect(x-f*10-3,y+13,6,16);
  ctx.fillStyle=col;ctx.fillRect(x-8,y+13,16,18);
  ctx.fillStyle='#e0b080';ctx.beginPath();ctx.arc(x,y+8,7,0,7);ctx.fill();
  ctx.fillStyle=col;ctx.fillRect(x-7,y+2,14,4);
  ctx.save();ctx.translate(x,y+20);ctx.rotate(a);ctx.fillStyle='#222';const L=WP[w||0].len;ctx.fillRect(0,-2.5,L,5);if(w===3)ctx.fillRect(4,-5,8,2);ctx.restore();
  if(!isMe){ctx.fillStyle='#000a';ctx.fillRect(x-14,y-12,28,4);ctx.fillStyle=e.hp>35?'#4fd36a':'#ff5a4a';ctx.fillRect(x-14,y-12,28*(e.hp/100),4);ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(e.n||'',x,y-16);ctx.textAlign='start'}
}
function drawStick(s,defx,defy,col){
  const ox=s?s.ox:defx,oy=s?s.oy:defy;ctx.globalAlpha=s?.5:.18;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ox,oy,70,0,7);ctx.fill();
  if(s){const dx=s.x-s.ox,dy=s.y-s.oy,m=Math.hypot(dx,dy),k=m>70?70/m:1;ctx.globalAlpha=.8;ctx.fillStyle=col;ctx.beginPath();ctx.arc(ox+dx*k,oy+dy*k,28,0,7);ctx.fill()}
  ctx.globalAlpha=1;
}
function render(now,dt){
  ctx.fillStyle='#9fd4ff';ctx.fillRect(0,0,vw,vh);
  if(!bg)return;
  const sc=Math.min(vh/430,vw/560);
  const tx=me.x+PW/2,ty=me.y+PH/2;
  cam.x+=(tx-cam.x)*Math.min(1,dt*8);cam.y+=(ty-cam.y)*Math.min(1,dt*8);
  const hw=vw/sc/2,hh=vh/sc/2;cam.x=clamp(cam.x,hw,W-hw);cam.y=clamp(cam.y,hh,H-hh);
  if(W<hw*2)cam.x=W/2;if(H<hh*2)cam.y=H/2;
  ctx.save();ctx.translate(vw/2,vh/2);ctx.scale(sc,sc);ctx.translate(-cam.x,-cam.y);
  ctx.drawImage(bg,0,0);
  meScr.x=vw/2+(tx-cam.x)*sc;meScr.y=vh/2+(me.y+20-cam.y)*sc;
  view.pk.forEach(function(k){const t=PKTY[k.ty],by=Math.sin(now*3+k.i)*3;ctx.fillStyle=t.c;ctx.fillRect(k.x-10,k.y-10+by,20,20);ctx.strokeStyle='#000';ctx.lineWidth=1.5;ctx.strokeRect(k.x-10,k.y-10+by,20,20);ctx.fillStyle='#000';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(t.l,k.x,k.y+5+by);ctx.textAlign='start'});
  Object.keys(ents).forEach(function(id){const e=ents[id];if(id===myId)return;e.x+=(e.tx-e.x)*Math.min(1,dt*14);e.y+=(e.ty-e.y)*Math.min(1,dt*14);drawPlayer(e,now,false)});
  if(view.ph==='play'||view.ph==='end'){const e={x:me.x,y:me.y,vx:me.vx,a:ctl.aim,f:Math.cos(ctl.aim)>=0?1:-1,c:(ents[myId]&&ents[myId].c)||0,hp:me.hp,n:myName};drawPlayer(e,now,true)}
  ctx.fillStyle='#ffe66a';ctx.lineWidth=2.5;
  bl.forEach(function(b){ctx.strokeStyle='rgba(255,230,120,.9)';ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.018,b.y-b.vy*.018);ctx.stroke()});
  sparks.forEach(function(s){ctx.globalAlpha=Math.max(0,s.l*2.5);ctx.fillStyle=s.c;ctx.fillRect(s.x,s.y,2.5,2.5)});ctx.globalAlpha=1;
  floats.forEach(function(f){ctx.globalAlpha=Math.min(1,f.t*2);ctx.fillStyle=f.c;ctx.font='bold 12px system-ui';ctx.fillText(f.s,f.x,f.y-(.7-f.t)*30)});ctx.globalAlpha=1;
  ctx.restore();
  if(view.ph==='play'){
    ctx.fillStyle='#000a';ctx.fillRect(10,10,120,10);ctx.fillStyle=me.hp>35?'#4fd36a':'#ff5a4a';ctx.fillRect(10,10,120*(me.hp/100),10);
    ctx.fillStyle='#000a';ctx.fillRect(10,24,120,7);ctx.fillStyle='#5ab4ff';ctx.fillRect(10,24,120*me.fuel,7);
    ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.fillText(WP[me.w||0].n+(me.am>0?' ×'+me.am:''),10,46);
    drawStick(st.L,vw*.14,vh*.72,'#5ab4ff');drawStick(st.R,vw*.86,vh*.72,'#ff6a5a');
    if(me.dead>0){ctx.fillStyle='rgba(120,0,0,.35)';ctx.fillRect(0,0,vw,vh);ctx.fillStyle='#fff';ctx.font='900 28px system-ui';ctx.textAlign='center';ctx.fillText('Réapparition dans '+me.dead+'…',vw/2,vh/2);ctx.textAlign='start'}
    if(vh>vw){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,vh*.4,vw,56);ctx.fillStyle='#ffd23a';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText('↻ Tourne ton téléphone en paysage',vw/2,vh*.4+34);ctx.textAlign='start'}
  }
}
let pT=0;
function frame(ts){
  const now=ts/1000,dt=Math.min(.05,now-(frame.l||now));frame.l=now;
  if(view.ph==='play'&&me.dead<=0){
    updateCtl();
    let r=dt;while(r>1e-4){const s=Math.min(r,1/60);stepBody(me,s,ctl.mx,ctl.jet);r-=s}
    if(!ctl.aimed)ctl.aim=ctl.mx<0?Math.PI:0;
    me.a=ctl.aim;me.f=Math.cos(me.a)>=0?1:-1;
    me.cd=Math.max(0,me.cd-dt);
    if(ctl.fire&&me.cd<=0){
      me.cd=WP[me.w||0].rate;
      if(net.mode==='host')hostFire(myId,me.a);else if(net.conn&&net.conn.open)net.conn.send({t:'f',a:+me.a.toFixed(3)});
      gun(me.w||0,.5,0);vib(15);
    }
    if(net.mode==='host'){const p=sim.players[myId];if(p&&p.dead<=0&&!(p.ign>0)){p.x=me.x;p.y=me.y;p.vx=me.vx;p.vy=me.vy;p.a=me.a;p.f=me.f;p.j=me.jt}}
    else if(net.mode==='guest'&&net.conn&&net.conn.open){pT+=dt;if(pT>=.05){pT=0;net.conn.send({t:'p',x:Math.round(me.x),y:Math.round(me.y),vx:Math.round(me.vx),vy:Math.round(me.vy),a:+me.a.toFixed(2),f:me.f,j:me.jt?1:0})}}
  }
  for(let i=bl.length-1;i>=0;i--){const b=bl[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(b.l<=0||solidAt(b.x,b.y)){if(b.l>0)for(let k=0;k<3;k++)sparks.push({x:b.x,y:b.y,vx:(Math.random()-.5)*90,vy:(Math.random()-.5)*90,l:.25,c:'#ffe28a'});bl.splice(i,1)}}
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=300*dt;s.l-=dt;if(s.l<=0)sparks.splice(i,1)}
  for(let i=floats.length-1;i>=0;i--){floats[i].t-=dt;if(floats[i].t<=0)floats.splice(i,1)}
  render(now,dt);
  requestAnimationFrame(frame);
}

buildBg();showMenu();requestAnimationFrame(frame);
window.HB={sim:sim,hostFire:hostFire,simStep:simStep,stepBody:stepBody,addPlayer:addPlayer,startMatch:startMatch,makeState:makeState,me:me,view:view,SOL:SOL,startLocal:function(){net={mode:'host',conns:[]};myId='h';sim.players={};sim.phase='lobby';addPlayer('h','Test');addPlayer('b1','Bot A',true);addPlayer('b2','Bot B',true);addPlayer('b3','Bot C',true);startMatch();lastPh='';startLoop();broadcast()}};
})();
